[package]
name = "mistralai-client"
description = "Mistral AI API client library for Rust (unofficial)."
license = "Apache-2.0"
version = "0.15.0"

edition = "2021"
rust-version = "1.76.0"

authors = ["Ivan Gabriele <ivan.gabriele@protonmail.com>"]
categories = ["api-bindings"]
homepage = "https://github.com/ivangabriele/mistralai-client-rs#readme"
keywords = ["mistral", "mistralai", "client", "api", "llm"]
readme = "README.md"
repository = "https://github.com/ivangabriele/mistralai-client-rs"

[dependencies]
async-stream = "0.3"
async-trait = "0.1"
base64 = "0.22.1"
env_logger = "0.11.3"
eventsource-stream = "0.2.3"
futures = "0.3.30"
log = "0.4.21"
mime_guess = "2.0.5"
reqwest = { version = "0.12", features = ["json", "blocking", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = "0.26.1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

[dev-dependencies]
jrest = "0.2"
